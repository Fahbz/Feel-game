<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FEEL Family à l'école des licornes</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root { box-sizing: border-box; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); --bg: #6dc8f5; }
  :root:not([data-theme="light"]) { --bg: #6dc8f5; }
  :root[data-theme="dark"] { --bg: #6dc8f5; }
  html, body { height: 100%; margin: 0; background: var(--bg); }
  body { display: flex; align-items: center; justify-content: center; overflow: hidden; font-family: 'Fredoka', 'Trebuchet MS', system-ui, sans-serif; }
  canvas { width: 100%; max-width: 960px; max-height: 100%; aspect-ratio: 16 / 9; touch-action: none; display: block; border-radius: 18px; }
  canvas:focus-visible { outline: 3px solid #ffe27a; }
</style>
</head>
<body>
<canvas id="g" width="960" height="540" tabindex="0" aria-label="Jeu FEEL Family à l'école des licornes : une licorne et son cavalier attrapent des étoiles magiques"></canvas>
<script>
const cv = document.getElementById('g'), ctx = cv.getContext('2d');
const W = 960, H = 540;
const FONT = "'Fredoka','Trebuchet MS',sans-serif";
const RAINBOW = ['#ff5d73','#ff9f4a','#ffd93d','#6fdc8c','#5ab8ff','#b48cff'];
const FLAME = ['#ff3d1f','#ff7a1a','#ffb81f','#ffd84a','#fff1a8','#ff5a2a'];
const INK = '#4a2a86';

// ---------- personnages ----------
const RIDERS = [
  { name:'Elia',    skin:'#ffe0c8', hair:'#8b5a3c', style:'mid',   dress:'#8a5cf0', band:'#7a3fe0', belt:'#ffd24a', boot:'#5b3a9a', eyeG:'#7a4a2a' },
  { name:'Liv',     skin:'#ffe0c8', hair:'#f4cf6a', style:'braid', dress:'#a9d8ff', band:null,      belt:'#ffffff', boot:'#7aa7e8', eyeG:'#3d9be0' },
  { name:'Fabien',  skin:'#f2c9a6', hair:'#4a3020', style:'short', dress:'#8a5a3c', legCol:'#1f3a6b', boot:'#3a2418', male:true, beard:true, glasses:true, cap:true, eyeG:'#2a1a10' },
  { name:'Estelle', skin:'#ffe0c8', hair:'#f6d36a', style:'bob',   dress:'#ffd23f', band:null,      belt:'#ff9a3c', boot:'#c98a1f', eyeG:'#5a8fd0' }
];
const UNIS = [
  { name:'Wildstar', power:'light', dur:3, cd:9, mark:'stars', body:'#b9b8ff', bodyHi:'#e3e1ff', hoof:'#ffd24a', horn:'#ffd24a', eye:'#8a5cf0', glow:'#b99cff', mw:1,
    mane:['#ff5d73','#ffd93d','#6fdc8c','#5ab8ff','#b48cff'], trail:RAINBOW,
    info:['Magie de la lumière','Pont arc-en-ciel et','vision arc-en-ciel'] },
  { name:'River', power:'water', dur:1.2, cd:9, mark:'drops', body:'#7ec3ff', bodyHi:'#c4e8ff', hoof:'#cfeeff', horn:'#e6f7ff', eye:'#1fb5d9', glow:'#7ad0ff', mw:1,
    mane:['#1e6fd9','#4aa3ff','#9ee7ff'], trail:['#1e6fd9','#4aa3ff','#7ec3ff','#9ee7ff','#c4f2ff','#ffffff'],
    info:['Magie de l’eau','Vague : nuages en','étoiles, te soigne'] },
  { name:'Leaf', power:'plants', dur:4, cd:9, mark:'plants', body:'#e9cf8a', bodyHi:'#f8e8b4', hoof:'#b98b4a', horn:'#ff9a3c', eye:'#3fb06a', glow:'#c9a0ff', mw:1.3,
    mane:['#8e4bd6','#6fd06f','#a77be8','#58c46a','#7a3fc9'], trail:['#7a3fc9','#8e4bd6','#a77be8','#58c46a','#6fd06f','#9be88a'],
    info:['Magie des plantes','Lianes et papillon','qui voit au loin'] },
  { name:'Glacier', power:'ice', dur:3.2, cd:11, mark:'snow', body:'#f1f4ff', bodyHi:'#ffffff', hoof:'#bcd6ff', horn:'#c9b0ff', eye:'#4aa3ff', glow:'#aee0ff', mw:1,
    mane:['#9fd8ff','#ffc4dc','#bfe6ff','#ffd9e8','#8ccaf5'], trail:['#9fd8ff','#bfe6ff','#ffffff','#ffd9e8','#ffc4dc','#8ccaf5'],
    info:['Magie de la glace','Fige le temps et','gèle les nuages'] },
  { name:'Cinder', power:'fire', dur:3.5, cd:10, mark:'flames', body:'#ff8a1f', bodyHi:'#ffc266', hoof:'#6b3f1f', horn:'#fff0c8', eye:'#e0502a', glow:'#ff9a4a', mw:1.15,
    mane:['#e8322a','#ffd23f','#ff5a2a','#ffb81f','#c91f1f'], trail:['#e8322a','#ff5a2a','#ff8a1f','#ffb81f','#ffd23f','#fff0c8'],
    info:['Magie du feu','Boules de feu, sabots','brûlants et vitesse'] }
];

// ---------- état ----------
let state = 'title', time = 0, ptime = 0, dist = 0, speed = 240, spawnT = 0, shake = 0;
let items = [], parts = [], fbs = [], bgSpark = [], farClouds = [];
const vil = { y:300, ty:300, mv:1, cast:0 };
const sel = { row:0, r:0, u:0 };
const P = { x:230, y:270, vy:0, hp:3, maxHp:3, score:0, inv:0, hold:false, trail:[], phase:0, magic:0, cd:0, bf:null, fbT:0, rider:RIDERS[0], uni:UNIS[0] };
for (let i=0;i<46;i++) bgSpark.push({x:Math.random()*W,y:Math.random()*H*.8,s:Math.random()*1.5+.6,p:Math.random()*6});
for (let i=0;i<7;i++) farClouds.push({x:Math.random()*W,y:50+Math.random()*190,s:.7+Math.random()*1.0,col:['#ffffff','#ffd9f0','#e6d9ff'][i%3]});

// ---------- classement ----------
const KEY='licornes-du-ciel-classement';
function loadScores(){ try{ const a=JSON.parse(localStorage.getItem(KEY)||'[]'); return Array.isArray(a)?a:[]; }catch(e){ return []; } }
let board = loadScores(), cur = null, rank = -1;
function saveScore(e){
  board.push(e); board.sort((a,b)=>b.score-a.score); board=board.slice(0,10);
  try{ localStorage.setItem(KEY,JSON.stringify(board)); }catch(e2){}
  return board;
}
function startGame(){
  P.rider=RIDERS[sel.r]; P.uni=UNIS[sel.u];
  ptime=0; speed=240; spawnT=0; items=[]; parts=[]; fbs=[]; shake=0;
  Object.assign(P,{x:230,y:270,vy:0,hp:3,maxHp:3,score:0,inv:0,trail:[],magic:0,cd:0,bf:null,fbT:0,hold:false,shield:false});
  portalNext=500; portalMsgT=0; B=null;
  boss.on=false; boss.fx=[]; boss.hp=0; boss.stun=0; boss.defeat=0; boss.intro=0; boss.vol=0; bossNext=4000; bossWins=0; shieldT=30; toastT=0; runCoins=0; fbs=[]; setMusicMode('fairy'); saveShop();
  decFrom=0; decTo=0; decT=1; bannerT=0;
  state='play'; beep(520,.25,'triangle',.08,880);
}
function endGame(){
  state='over'; boss.on=false; setMusicMode('fairy'); saveShop();
  cur={rider:P.rider.name,uni:P.uni.name,score:Math.floor(P.score),time:Math.floor(ptime)};
  saveScore(cur); rank=board.indexOf(cur);
  beep(392,.4,'triangle',.08,262);
}

// ---------- audio ----------
let AC=null;
function beep(f,d=.12,type='sine',v=.08,f2){
  try{
    if(!AC) AC=new (window.AudioContext||window.webkitAudioContext)();
    const o=AC.createOscillator(), g=AC.createGain();
    o.type=type; o.frequency.setValueAtTime(f,AC.currentTime);
    if(f2) o.frequency.exponentialRampToValueAtTime(f2,AC.currentTime+d);
    g.gain.setValueAtTime(v,AC.currentTime); g.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+d);
    o.connect(g); g.connect(AC.destination); o.start(); o.stop(AC.currentTime+d);
  }catch(e){}
}

// ---------- zones cliquables ----------
function cardRect(row,i){ return row? {x:52+i*132,y:306,w:120,h:160} : {x:52+i*162,y:104,w:150,h:160}; }
const PLAYBTN={x:712,y:448,w:196,h:52};
const REPLAY={x:W/2-250,y:H/2+160,w:230,h:52}, MENUBTN={x:W/2+20,y:H/2+160,w:230,h:52};
function inR(r,x,y){ return x>=r.x&&x<=r.x+r.w&&y>=r.y&&y<=r.y+r.h; }
function btnPos(){ return {x:62, y:H-62}; }

// ---------- contrôles ----------
const HOLD=['z','w','arrowup',' '], held=new Set(), ptrs=new Set();
addEventListener('keydown',e=>{
  const k=e.key.toLowerCase();
  musicInit();
  if(['arrowup','arrowdown','arrowleft','arrowright',' '].includes(k)) e.preventDefault();
  if(k==='m'){ toggleMusic(); return; }
  if(state==='title'){ if(k==='enter'||k===' ') state='select'; else if(/^[0-9]$/.test(k)){ state='code'; codeBuf=''; codePress(k); } return; }
  if(state==='code'){
    if(/^[0-9]$/.test(k)) codePress(k);
    if(k==='backspace') codeBuf=codeBuf.slice(0,-1);
    if(k==='escape') state='title';
    return;
  }
  if(state==='dev'){
    if(k==='arrowup') devSel=(devSel+2)%3;
    if(k==='arrowdown') devSel=(devSel+1)%3;
    if(k==='enter'||k===' ') devAct(devSel);
    if(k==='escape') state='title';
    return;
  }
  if(state==='select'){
    if(k==='arrowleft'||k==='arrowright'){
      const d=k==='arrowright'?1:-1;
      if(sel.row===0) sel.r=(sel.r+d+RIDERS.length)%RIDERS.length; else if(sel.row===1) sel.u=(sel.u+d+UNIS.length)%UNIS.length;
    }
    if(k==='b'){ state='shop'; shopSel=0; return; }
    if(k==='arrowup') sel.row=(sel.row+2)%3;
    if(k==='arrowdown') sel.row=(sel.row+1)%3;
    if(k==='enter'||k===' '){ if(sel.row<2) sel.row++; else startGame(); }
    return;
  }
  if(state==='shop'){
    if(shopConfirm){
      if(k==='arrowleft'||k==='arrowright') shopConfSel=1-shopConfSel;
      if(k==='enter'||k===' ') confirmAct(shopConfSel);
      if(k==='escape') shopConfirm=null;
      return;
    }
    if(k==='e') shopTry(shopSel);
    if(k==='arrowleft') shopSel=(shopSel+9)%10;
    if(k==='arrowright') shopSel=(shopSel+1)%10;
    if(k==='arrowup') shopTab=(shopTab+2)%3;
    if(k==='arrowdown') shopTab=(shopTab+1)%3;
    if(k==='enter'||k===' ') shopBuyOrEquip(shopSel);
    if(k==='escape'||k==='backspace') leaveShop();
    return;
  }
  if(state==='over'){ if(k==='enter'||k===' ') startGame(); if(k==='escape') state='select'; return; }
  if(state==='pause'){
    if(k==='escape') resumeGame();
    if(k==='arrowup') pauseSel=(pauseSel+2)%3;
    if(k==='arrowdown') pauseSel=(pauseSel+1)%3;
    if(k==='enter'||k===' ') pauseAction(pauseSel);
    return;
  }
  if(state==='play'||state==='bonus'){
    if(k==='escape'){ pauseGame(); return; }
    if(HOLD.includes(k)) held.add(k);
    if(k==='p') cast();
  }
});
addEventListener('keyup',e=>{ held.delete(e.key.toLowerCase()); });
addEventListener('blur',()=>{ held.clear(); ptrs.clear(); pauseGame(); });
document.addEventListener('visibilitychange',()=>{ if(document.hidden) pauseGame(); });
cv.addEventListener('pointerdown',e=>{
  cv.focus(); cv.setPointerCapture(e.pointerId);
  musicInit();
  const r=cv.getBoundingClientRect(), px=(e.clientX-r.left)/r.width*W, py=(e.clientY-r.top)/r.height*H;
  const mb=musicBtnPos(); if(Math.hypot(px-mb.x,py-mb.y)<mb.r+6){ toggleMusic(); return; }
  if(state==='title'){ if(Math.hypot(px-GEAR.x,py-GEAR.y)<GEAR.r+8){ state='code'; codeBuf=''; return; } state='select'; return; }
  if(state==='code'){ for(let i=0;i<12;i++) if(inR(keyRect(i),px,py)){ keyAct(i); return; } return; }
  if(state==='dev'){ for(let i=0;i<3;i++) if(inR(devBtn(i),px,py)){ devAct(i); return; } return; }
  if(state==='select'){
    for(let row=0;row<2;row++) for(let i=0;i<(row?UNIS.length:RIDERS.length);i++) if(inR(cardRect(row,i),px,py)){ if(row) sel.u=i; else sel.r=i; sel.row=row; return; }
    if(inR(SHOPBTN,px,py)){ state='shop'; shopSel=0; return; }
    if(inR(PLAYBTN,px,py)) startGame();
    return;
  }
  if(state==='shop'){
    if(shopConfirm){ for(let i=0;i<(shopConfirm.ok?2:1);i++) if(inR(confirmBtn(i),px,py)){ confirmAct(i); return; } return; }
    if(inR(PAGEPREV,px,py)){ if(shopSel>=5) shopSel-=5; return; }
    if(inR(PAGENEXT,px,py)){ if(shopSel<5) shopSel+=5; return; }
    for(let i=0;i<3;i++) if(inR(tabRect(i),px,py)){ shopTab=i; shopSel=0; return; }
    const its=shopItems();
    for(let i=0;i<its.length;i++){
      if(Math.floor(i/5)!==Math.floor(shopSel/5)) continue;
      if(inR(shopBtnRect(i,0),px,py)){ shopSel=i; if(its[i]) shopTry(i); else shopBuyOrEquip(i); return; }
      if(its[i]&&inR(shopBtnRect(i,1),px,py)){ shopSel=i; shopBuyOrEquip(i); return; }
      if(inR(shopCardRect(i),px,py)){ shopSel=i; return; }
    }
    if(inR(SHOPBACK,px,py)) leaveShop();
    return;
  }
  if(state==='over'){ if(inR(REPLAY,px,py)) startGame(); else if(inR(MENUBTN,px,py)) state='select'; return; }
  if(state==='pause'){ for(let i=0;i<3;i++) if(inR(pauseRect(i),px,py)){ pauseAction(i); return; } return; }
  if(Math.hypot(px-(W-34),py-84)<28){ pauseGame(); return; }
  const b=btnPos();
  if(state==='play'&&Math.hypot(px-b.x,py-b.y)<52){ cast(); return; }
  ptrs.add(e.pointerId);
});
function release(e){ ptrs.delete(e.pointerId); }
cv.addEventListener('pointerup',release); cv.addEventListener('pointercancel',release);

// ---------- magie ----------
function cast(){
  if(state!=='play'||P.hp<=0||P.cd>0) return;
  const U=P.uni; P.cdMax=U.cd*(boss.on?.5:1); P.cd=P.cdMax; P.magic=U.dur;
  const cx=P.x+12, cy=P.y-12;
  if(U.power==='light'){
    burst(cx,cy,['#ffffff','#fff3a0','#ffe27a'],22,220); beep(700,.5,'triangle',.08,1400);
  } else if(U.power==='water'){
    beep(300,.5,'sine',.09,700);
    for(const it of items){ if(it.t==='cloud'&&it.x>P.x&&it.x<P.x+420){ it.t='star'; it.r=13; it.frozen=false; burst(it.x,it.y,['#9ee7ff','#4aa3ff','#ffffff'],14); } }
    if(P.hp<P.maxHp){ P.hp++; burst(cx,cy,['#9ee7ff','#ff7eb6'],14); }
    if(bossLive()) bossHit(Math.abs(P.y-vil.y)<130?22:16);
    for(let k=0;k<26;k++) parts.push({x:P.x+50+Math.random()*30,y:P.y-20+(Math.random()-.5)*40,vx:200+Math.random()*300,vy:(Math.random()-.5)*60,l:.8,c:['#9ee7ff','#4aa3ff','#d9f4ff'][k%3],r:3+Math.random()*3});
  } else if(U.power==='plants'){
    P.bf={x:P.x+30,y:P.y-20};
    burst(cx,cy,['#6fd06f','#58c46a','#c9a0ff','#ffffff'],20,180); beep(520,.5,'sine',.08,980);
  } else if(U.power==='ice'){
    burst(cx,cy,['#ffffff','#bfe6ff','#9fd8ff'],12,120);
    for(let k=0;k<30;k++) parts.push({x:P.x+40,y:P.y-20+(Math.random()-.5)*30,vx:300+Math.random()*350,vy:(Math.random()-.5)*110,l:.9,c:['#ffffff','#bfe6ff','#9fd8ff'][k%3],r:2.5+Math.random()*3,sp:k%2===0});
    beep(1200,.6,'triangle',.07,300);
  } else {
    P.fbT=0;
    burst(P.x+76,P.y-86,['#ff7a1a','#ffd84a','#ff3d1f'],22,200); beep(160,.5,'sawtooth',.08,520);
  }
}

// ---------- logique ----------
function burst(x,y,cols,n=12,spd=160){
  for(let i=0;i<n;i++){
    const a=Math.random()*6.28, s=Math.random()*spd+30;
    parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:.7+Math.random()*.4,c:cols[i%cols.length],r:2+Math.random()*3,sp:i%2===0});
  }
}
function spawn(){
  let roll=Math.random();
  if(boss.on&&roll>=.42&&roll<.88) roll=.2;
  if(roll<.42){
    const y0=80+Math.random()*380, n=3+Math.floor(Math.random()*3), amp=Math.random()*40;
    for(let i=0;i<n;i++) items.push({t:'star',x:W+40+i*46,y:y0+Math.sin(i*1.1)*amp,r:13,p:Math.random()*6});
  } else if(roll<.88){
    if(Math.random()<.6){
      vil.cast=.5; items.push({t:'cloud',x:W-110,y:vil.y,r:30+Math.random()*14,p:Math.random()*6});
      burst(W-120,vil.y,['#c9a0ff','#8a5cf0','#ffffff'],8,90);
    } else items.push({t:'cloud',x:W+60,y:70+Math.random()*400,r:30+Math.random()*14,p:Math.random()*6});
  } else {
    items.push({t:'heart',x:W+40,y:90+Math.random()*360,r:15,p:0});
  }
}
function trailCols(p){ if(p.uni.power==='fire'&&p.magic>0) return FLAME; const t=eqItem('trail'); return t?t.cols:p.uni.trail; }
function update(dt){
  if(state==='pause') return;
  time+=dt;
  if(shopMsgT>0) shopMsgT-=dt;
  if(codeErr>0) codeErr-=dt;
  if(coinsDirty&&time-lastSave>5) saveShop();
  if(state==='bonus'){ updateBonus(dt); return; }
  const U=P.uni, pow=U.power;
  const iceOn=(state==='play'&&pow==='ice'&&P.magic>0);
  const fireOn=(state==='play'&&pow==='fire'&&P.magic>0);
  const wf=iceOn?.25:(fireOn?1.3:1);
  speed=240+Math.min(ptime*4,220);
  dist+=speed*wf*dt;
  farClouds.forEach(c=>{ c.x-=speed*.12*c.s*wf*dt; if(c.x<-120) { c.x=W+120; c.y=50+Math.random()*190; } });
  bgSpark.forEach(s=>{ s.x-=(18+s.s*22)*dt; if(s.x<-10){ s.x=W+10; s.y=Math.random()*H*.8; } });
  vil.mv-=dt; if(vil.mv<=0){ vil.ty=215+Math.random()*180; vil.mv=boss.on?(.8+Math.random()*.7):(1+Math.random()); }
  vil.y+=(vil.ty-vil.y)*Math.min(1,dt*2.5*((boss.on&&boss.stun>0)?0:1));
  if(vil.cast>0) vil.cast-=dt;
  if(state!=='play'&&state!=='over'){ decFrom=0; decTo=0; decT=1; bannerT=0; }
  if(state!=='play') return;
  ptime+=dt;
  const want=boss.on?4:[0,1,2,3][Math.floor(P.score/1000)%4];
  if(want!==decTo){ decFrom=decTo; decTo=want; decT=0; decStarts[want]=dist; if(want!==0&&want!==4){ bannerT=4.5; bannerKind=want; } }
  if(decT<1) decT=Math.min(1,decT+dt/1.4);
  if(bannerT>0) bannerT-=dt;
  if(portalMsgT>0) portalMsgT-=dt;
  if(toastT>0) toastT-=dt;
  if(P.hp>0&&!boss.on&&P.score>=portalNext){ portalNext+=1000; if(P.maxHp<6){ items.push({t:'portal',x:W+100,y:190+Math.random()*190,r:30,p:0}); portalMsgT=4; } }
  if(P.hp>0&&!boss.on&&P.score>=bossNext) startBoss();
  if(boss.on) updateBoss(dt,wf);
  if(bossWins>0){ shieldT-=dt; if(shieldT<=0){ shieldT=27+Math.random()*6; if(!P.shield) items.push({t:'shield',x:W+40,y:110+Math.random()*320,r:16,p:Math.random()*6}); } }
  P.hold = held.size>0 || ptrs.size>0;

  spawnT-=dt*wf;
  if(spawnT<=0){ spawn(); spawnT=boss.on?1.8:Math.max(.55,1.1-ptime*.006); }

  const p=P, cx=p.x+12, cy=p.y-12;
  if(p.hp<=0){ p.vy+=900*dt; p.y+=p.vy*dt; p.x-=speed*.5*dt; p.trail=[]; }
  else {
    p.vy += (p.hold?(fireOn?-2100:-1500):(fireOn?1500:1100))*dt;
    const mv=fireOn?480:340;
    p.vy = Math.max(-mv,Math.min(mv,p.vy));
    p.y += p.vy*dt;
    if(p.y<40){ p.y=40; p.vy=0; }
    if(p.y>H-70){ p.y=H-70; p.vy=0; }
    if(p.inv>0) p.inv-=dt;
    if(p.cd>0) p.cd-=dt;
    if(p.magic>0) p.magic-=dt;
    p.score+=dt*2;
    p.trail.forEach(q=>q.x-=speed*wf*dt);
    p.trail.push({x:p.x-34,y:p.y+16});
    p.trail=p.trail.filter(q=>q.x>-10);
    const tc=trailCols(p);
    if(Math.random()<dt*(fireOn?50:22)) parts.push({x:p.x-30,y:p.y+14+(Math.random()-.5)*22,vx:-speed*.5,vy:(Math.random()-.5)*30-(fireOn?40:0),l:.7,c:tc[Math.floor(Math.random()*6)],r:2+Math.random()*2.5,sp:true});
  }

  if(p.hp>0 && p.magic>0){
    if(pow==='light'){
      for(let i=items.length-1;i>=0;i--){ const it=items[i];
        if(it.t==='cloud'&&it.x>p.x&&it.x<p.x+270&&Math.abs(it.y-p.y)<75){ burst(it.x,it.y,RAINBOW,16); items.splice(i,1); p.score+=5; beep(1000,.1,'triangle',.05); } }
      if(bossLive()&&Math.abs(p.y-vil.y)<80) bossHit(dt*10);
    }
    if(pow==='plants'){
      items.forEach(it=>{ if(it.t==='star'){ const dx=cx-it.x, dy=cy-it.y, d=Math.hypot(dx,dy); if(d<200&&d>1){ it.x+=dx/d*430*dt; it.y+=dy/d*430*dt; } } });
      if(bossLive()) bossHit(dt*3.5);
      const bf=p.bf;
      if(bf){
        bf.x+=420*dt;
        if(bossLive()&&bf.x>W-170&&Math.abs(bf.y-vil.y)<120){ bossHit(6); burst(bf.x,bf.y,['#c9a0ff','#ffe27a','#ffffff'],16); p.bf=null; }
        let tgt=null, bd=1e9;
        for(const it of items){ if(it.t==='star'&&it.x>bf.x-20&&it.x<bf.x+320){ const d=Math.abs(it.y-bf.y)+(it.x-bf.x)*.3; if(d<bd){ bd=d; tgt=it; } } }
        bf.y += tgt? Math.max(-240*dt,Math.min(240*dt,tgt.y-bf.y)) : Math.sin(time*5)*40*dt;
        for(let i=items.length-1;i>=0;i--){ const it=items[i];
          if(it.t==='star'&&Math.hypot(it.x-bf.x,it.y-bf.y)<26){ p.score+=10; addCoin(); burst(it.x,it.y,['#c9a0ff','#ffe27a','#ffffff'],10); items.splice(i,1); beep(900+Math.random()*300,.1,'triangle',.06); } }
        if(bf.x>W+30) p.bf=null;
      }
    }
    if(pow==='fire'){ // boules de feu lancées depuis la corne
      p.fbT-=dt;
      if(p.fbT<=0){ p.fbT=.26; fbs.push({x:p.x+82,y:p.y-62}); beep(300+Math.random()*80,.12,'sawtooth',.04,120); }
    }
  } else if(p.bf) p.bf=null;
  if(iceOn){
    items.forEach(it=>{ if(it.t==='cloud') it.frozen=true; });
    if(bossLive()){ boss.stun=Math.max(boss.stun,.25); bossHit(dt*5); }
    if(Math.random()<dt*70) parts.push({x:Math.random()*W,y:-10,vx:-30,vy:80+Math.random()*60,l:2.6,c:'#ffffff',r:2+Math.random()*2.2});
  } else items.forEach(it=>{ if(it.frozen) it.frozen=false; });

  items.forEach(it=>{ it.x-=(speed*wf+(it.frozen?0:(it.ex||0))*wf)*dt; if(it.dy&&!it.frozen) it.y+=it.dy*wf*dt; if(bossWins>0&&it.t==='cloud'&&!it.frozen) it.y+=Math.sin(time*3+it.p)*45*wf*dt; });
  items=items.filter(it=>it.x>-80&&it.y>-120&&it.y<H+120);

  // boules de feu : elles brûlent les nuages
  fbs.forEach(f=>f.x+=720*dt);
  for(const f of fbs){
    if(bossLive()&&f.x>W-170&&Math.abs(f.y-vil.y)<90){ bossHit(2.4); burst(f.x,f.y,['#ff7a1a','#ffd84a','#ffffff'],14); f.x=W+100; beep(200,.15,'sawtooth',.05,80); continue; }
    for(let i=items.length-1;i>=0;i--){ const it=items[i];
      if(it.t==='cloud'&&Math.hypot(it.x-f.x,it.y-f.y)<it.r+18){
        burst(it.x,it.y,['#ff7a1a','#ffd84a','#6b6a8f','#ff3d1f'],20); items.splice(i,1); p.score+=5; f.x=W+100; beep(220,.2,'sawtooth',.05,90);
      }
    }
  }
  fbs=fbs.filter(f=>f.x<W+40);

  if(p.hp>0){
    const shield=(pow==='light'&&p.magic>0), mag=shield?110:0;
    for(let i=items.length-1;i>=0;i--){
      const it=items[i], d=Math.hypot(it.x-cx,it.y-cy);
      if(it.t==='star' && d<it.r+30+mag){
        p.score+=10; addCoin(); if(bossLive()) bossHit(.25); items.splice(i,1); burst(it.x,it.y,['#ffe27a','#fff6c2','#ffffff'],10); beep(880+Math.random()*240,.12,'triangle',.07);
      } else if(it.t==='heart' && d<it.r+30){
        if(p.hp<p.maxHp) p.hp++; p.score+=25; items.splice(i,1); burst(it.x,it.y,['#ff7eb6','#ffc2e2'],14); beep(660,.25,'sine',.09,1100);
      } else if(it.t==='cloud' && !it.frozen && p.inv<=0 && !shield && d<it.r+22){
        if(p.shield){ p.shield=false; p.inv=1; items.splice(i,1); burst(it.x,it.y,['#9ee7ff','#ffffff','#5ab8ff'],18); beep(900,.25,'triangle',.08,400); }
        else { p.hp--; p.inv=1.6; p.vy=-120; items.splice(i,1); shake=.25;
        burst(it.x,it.y,['#6b6a8f','#8a89ad','#cfcde8'],16); beep(180,.3,'sawtooth',.07,70); }
      } else if(it.t==='portal' && Math.abs(it.x-cx)<38 && Math.abs(it.y-cy)<82){
        items.splice(i,1); enterBonus(); break;
      } else if(it.t==='shield' && d<it.r+30){
        items.splice(i,1); p.shield=true; burst(it.x,it.y,['#9ee7ff','#ffffff','#5ab8ff'],16); beep(520,.3,'triangle',.08,1000); toast('Bouclier !','Il absorbe le prochain coup',1.8);
      }
    }
  }
  if(p.hp<=0 && p.y>H+60) endGame();

  parts.forEach(q=>{ q.x+=q.vx*dt; q.y+=q.vy*dt; q.vy+=120*dt; q.l-=dt; });
  parts=parts.filter(q=>q.l>0);
  if(shake>0) shake-=dt;
}

function text(t,x,y,size,col,align='center',w=600,outline){
  ctx.font=`${w} ${size}px ${FONT}`; ctx.textAlign=align; ctx.textBaseline='alphabetic';
  if(outline){ ctx.lineJoin='round'; ctx.lineWidth=Math.max(4,size*.24); ctx.strokeStyle=outline; ctx.strokeText(t,x,y); }

}
function shade(hex,amt){
  const n=parseInt(hex.slice(1,7),16); let r=n>>16, g=(n>>8)&255, b=n&255;
  const f=amt<0?0:255, t=Math.abs(amt);
  r=Math.round(r+(f-r)*t); g=Math.round(g+(f-g)*t); b=Math.round(b+(f-b)*t);
  return 'rgb('+r+','+g+','+b+')';
}
function blob(x,y,s,col,a=1){

function sparkle(x,y,r,col){

function star(x,y,r,rot,col){

function flame(x,y,s,c1,c2,f){

function heart(x,y,s,col){

function rr(x,y,w,h,r){ ctx.beginPath(); ctx.roundRect(x,y,w,h,r); }
function bez(p0,p1,p2,p3,t){
  const u=1-t, a=u*u*u, b=3*u*u*t, c=3*u*t*t, d=t*t*t;
  return [a*p0[0]+b*p1[0]+c*p2[0]+d*p3[0], a*p0[1]+b*p1[1]+c*p2[1]+d*p3[1]];
}
// mèche effilée suivant une courbe de Bézier
function ribbon(p0,p1,p2,p3,w0,w1,fill,glow,hl){
  const N=12, L=[], Rr=[];
  for(let i=0;i<=N;i++){
    const t=i/N, a=bez(p0,p1,p2,p3,t), b=bez(p0,p1,p2,p3,Math.min(1,t+.03)), c=bez(p0,p1,p2,p3,Math.max(0,t-.03));
    let dx=b[0]-c[0], dy=b[1]-c[1]; const d=Math.hypot(dx,dy)||1; dx/=d; dy/=d;
    const w=(w0+(w1-w0)*t)*(1+Math.sin(t*3.1416)*.22)/2;
    L.push([a[0]-dy*w,a[1]+dx*w]); Rr.push([a[0]+dy*w,a[1]-dx*w]);
  }
  ctx.beginPath();
  L.forEach((q,i)=>i?ctx.lineTo(q[0],q[1]):ctx.moveTo(q[0],q[1]));
  for(let i=N;i>=0;i--) ctx.lineTo(Rr[i][0],Rr[i][1]);
  ctx.closePath();
  if(glow){ ctx.shadowColor=fill; ctx.shadowBlur=glow; }
  ctx.fillStyle=fill; ctx.fill(); ctx.shadowBlur=0;
  if(hl){
    ctx.strokeStyle=hl; ctx.globalAlpha=.55; ctx.lineWidth=1.2; ctx.lineCap='round';
    ctx.beginPath(); ctx.moveTo(p0[0],p0[1]); ctx.bezierCurveTo(p1[0],p1[1],p2[0],p2[1],p3[0],p3[1]); ctx.stroke(); ctx.globalAlpha=1;
  }
}
// membre à segments de largeurs différentes, avec contour
function limb(pts,ws,col,outline){
  ctx.lineCap='round'; ctx.lineJoin='round';
  for(const pass of [0,1]){
    for(let i=0;i<pts.length-1;i++){
      ctx.strokeStyle=pass?col:outline; ctx.lineWidth=ws[i]+(pass?0:2.6);
      ctx.beginPath(); ctx.moveTo(pts[i][0],pts[i][1]); ctx.lineTo(pts[i+1][0],pts[i+1][1]); ctx.stroke();
    }
  }
}

function updateBonus(dt){
  const b=B; b.t+=dt;
  const hold=held.size>0||ptrs.size>0;
  const ctl=(b.phase==='intro'||b.phase==='play'||b.phase==='wait');
  b.trail.forEach(q=>q.x-=300*dt);
  if(ctl){
    b.vy+=(hold?-1500:1100)*dt; b.vy=Math.max(-340,Math.min(340,b.vy)); b.y+=b.vy*dt;

  }

  if(b.phase==='enter'){ if(b.t>=1.2) bonusPhase('intro'); }
  else if(b.phase==='intro'){ if(b.t>=3){ bonusPhase('play'); b.bt=0; } }
  else if(b.phase==='play'||b.phase==='wait'){
    if(b.phase==='play'){
      b.bt+=dt;
      while(b.thrown<30&&b.bt>=b.thrown+1) throwBall();
      if(b.thrown>=30) b.phase='wait';
    }
    const cx=242, cy=b.y-12;
    for(let i=b.balls.length-1;i>=0;i--){
      const ba=b.balls[i]; ba.vy+=ba.g*dt; ba.x+=ba.vx*dt; ba.y+=ba.vy*dt; ba.rot+=dt*8;

    }

  }
  else if(b.phase==='result'){
    if(!b.rewarded){
      b.rewarded=true; b.ok=b.caught>=b.goal;
      if(b.ok){ P.maxHp++; P.hp=Math.min(P.maxHp,P.hp+1); [523,659,784,1046].forEach((f,i)=>setTimeout(()=>beep(f,.18,'triangle',.08),i*120)); }

}

let musicOn=true, musicStarted=false, musicMode='fairy', mStep=0, mNext=0, mTimer=null, busF=null, busE=null, mMaster=null, noiseBuf=null;
try{ if(localStorage.getItem('feel-family-musique')==='off') musicOn=false; }catch(e){}
const MEL=[[79,.5],[81,.5],[84,1],[88,1],[86,1],[84,1.5],[81,.5],[79,2],[77,.5],[79,.5],[81,1],[84,1],[81,1],[79,1.5],[76,.5],[74,1],[72,1],[79,.5],[81,.5],[84,1],[88,1],[91,1],[89,1.5],[88,.5],[86,2],[84,.5],[86,.5],[88,1],[86,1],[84,1],[84,2],[79,1],[72,1]];
const melStep=new Array(64).fill(null);
(function(){ let acc=0; MEL.forEach(m=>{ melStep[Math.round(acc*2)]=m; acc+=m[1]; }); })();
const CH_ROOT=[48,41,45,43,48,41,43,48], CH_MIN=[0,0,1,0,0,0,0,0];
const CE_ROOT=[48,41,44,43,48,41,43,48], CE_MIN=[1,1,0,1,1,1,1,1];
function mtof(m){ return 440*Math.pow(2,(m-69)/12); }
function epicNote(m){ const pc=m%12; return (pc===4||pc===11||pc===9)?m-1:m; }
function stepDur(mode){ return 60/(mode==='epic'?138:116)/2; }
function voice(bus,when,freq,dur,type,vol,att,rel,lp){
  const o=AC.createOscillator(), g=AC.createGain(); o.type=type; o.frequency.value=freq;
  let node=o; if(lp){ const f=AC.createBiquadFilter(); f.type='lowpass'; f.frequency.value=lp; o.connect(f); node=f; }

  g.gain.setValueAtTime(vol,when+Math.max(att,dur-rel)); g.gain.exponentialRampToValueAtTime(.0001,when+dur+rel);

function nz(bus,when,dur,hp,vol){
  const s=AC.createBufferSource(); s.buffer=noiseBuf; const f=AC.createBiquadFilter(); f.type='highpass'; f.frequency.value=hp;
  const g=AC.createGain(); g.gain.setValueAtTime(vol,when); g.gain.exponentialRampToValueAtTime(.0001,when+dur);

function kick(bus,when){ const o=AC.createOscillator(), g=AC.createGain(); o.frequency.setValueAtTime(150,when); o.frequency.exponentialRampToValueAtTime(42,when+.12); g.gain.setValueAtTime(.55,when); g.gain.exponentialRampToValueAtTime(.0001,when+.26); o.connect(g); g.connect(bus); o.start(when); o.stop(when+.3); }

function clap(bus,when){ nz(bus,when,.12,1800,.16); nz(bus,when+.012,.1,2200,.12); }
function kickL(bus,when){ const o=AC.createOscillator(), g=AC.createGain(); o.frequency.setValueAtTime(130,when); o.frequency.exponentialRampToValueAtTime(48,when+.1); g.gain.setValueAtTime(.3,when); g.gain.exponentialRampToValueAtTime(.0001,when+.2); o.connect(g); g.connect(bus); o.start(when); o.stop(when+.24); }
function playStep(step,t,mode){
  const bar=Math.floor(step/8), sub=step%8, sd=stepDur(mode), ml=melStep[step];
  if(mode==='fairy'){
    const r=CH_ROOT[bar], ch=[r,r+(CH_MIN[bar]?3:4),r+7];

    if(sub===2||sub===6) clap(busF,t);
    if(sub%2===1) nz(busF,t,.03,8000,.035);
    if(sub===3||sub===7) voice(busF,t,mtof(r-12),sd*.9,'sine',.1,.005,.08);

    const r=CE_ROOT[bar], ch=[r,r+(CE_MIN[bar]?3:4),r+7];

function musicTick(){

function musicStart(){ if(mTimer||!AC) return; mNext=AC.currentTime+.1; mTimer=setInterval(musicTick,100); }
function musicStop(){ if(mTimer){ clearInterval(mTimer); mTimer=null; } }
function musicInit(){
  if(musicStarted) return; musicStarted=true;
  try{
    if(!AC) AC=new (window.AudioContext||window.webkitAudioContext)();
    if(AC.state==='suspended') AC.resume();
    mMaster=AC.createGain(); mMaster.gain.value=musicOn?.5:0; mMaster.connect(AC.destination);
    const mix=AC.createGain(); mix.connect(mMaster);

    mix.connect(dl); dl.connect(fb); fb.connect(dl); dl.connect(dO); dO.connect(mMaster);

const boss={on:false,hp:0,max:0,lvl:0,t:0,intro:0,defeat:0,atkT:0,n:0,vol:0,volT:0,stun:0,flash:0,fx:[]};

function toast(t,s,d){ toastTxt=t; toastSub=s||''; toastT=d||3; }

  ctx.globalAlpha=1;
}
function startBoss(){
  boss.on=true; boss.lvl=Math.floor(bossNext/4000)-1; boss.max=boss.hp=120+40*boss.lvl;
  boss.t=0; boss.intro=2.6; boss.defeat=0; boss.atkT=2.2; boss.n=0; boss.vol=0; boss.stun=0; boss.flash=0; boss.fx=[];

  P.cd=Math.min(P.cd,P.uni.cd*.5);
  toast('La sorcière des tempêtes arrive !','Vise-la avec ta magie et esquive ses éclairs',3);
  setMusicMode('epic'); beep(110,1.2,'sawtooth',.08,60);
}
function bossHit(d){
  if(!bossLive()) return;
  boss.hp-=d; boss.flash=.12;
  if(boss.hp<=0){
    boss.hp=0; boss.defeat=2.4; boss.fx=[]; boss.vol=0;
    items.forEach(it=>{ if(it.t==='cloud'){ it.t='star'; it.r=13; it.ex=0; it.dy=0; it.frozen=false; } });
    burst(W-78,vil.y,['#c9a0ff','#ffffff','#8a5cf0','#ffe27a'],40,300); beep(150,.9,'sawtooth',.1,40);
  }
}
function endBoss(){
  boss.on=false; bossWins++; if(bossWins===1) shieldT=20; const gain=30+10*boss.lvl;
  P.score+=500; addCoin(gain); P.hp=Math.min(P.maxHp,P.hp+1);
  toast('Sorcière vaincue !','+500 points  ·  +'+gain+' étoiles',3.5);
  setMusicMode('fairy'); saveShop();
  [523,659,784,1046].forEach((f,i)=>setTimeout(()=>beep(f,.2,'triangle',.08),i*130));
}
function bossAttack(){
  const f=boss.hp/boss.max, lvl=boss.lvl;
  boss.atkT=Math.max(.9,(f>.6?2.3:(f>.3?1.8:1.35))-.12*lvl);
  boss.n++; vil.cast=.5;
  if(boss.n%3===0){ boss.vol=f>.5?5:7; boss.volT=0; }
  else {
    const n=f>.5?1:2, warn=Math.max(.55,.95-.07*lvl);
    for(let k=0;k<n;k++){
      let y=P.y-12+(k===0?(Math.random()-.5)*50:(Math.random()<.5?-1:1)*(110+Math.random()*60));
      y=Math.max(70,Math.min(H-80,y));
      boss.fx.push({y,t:0,warn,dur:.35,hit:false,snd:false});
    }
  }
}
function updateBoss(dt,wf){
  boss.t+=dt; if(boss.flash>0) boss.flash-=dt;
  if(boss.intro>0){ boss.intro-=dt; return; }
  if(boss.defeat>0){
    if(Math.random()<dt*40) burst(W-78+(Math.random()-.5)*80,vil.y+(Math.random()-.5)*200,['#c9a0ff','#ffffff','#ffe27a'],4,160);
    boss.defeat-=dt; if(boss.defeat<=0) endBoss(); return;
  }
  const bdt=dt*wf;
  if(boss.stun>0) boss.stun-=dt;

  const g=ctx.createLinearGradient(0,r.y,0,r.y+r.h); g.addColorStop(0,on?'#ffe27a':'#ffd24a'); g.addColorStop(1,on?'#ffb347':'#f2a93b');
  ctx.fillStyle=g; rr(r.x,r.y,r.w,r.h,r.h/2); ctx.fill();
  ctx.strokeStyle=on?'#fff':'#fff8d6'; ctx.lineWidth=on?5:3; rr(r.x,r.y,r.w,r.h,r.h/2); ctx.stroke();
  text(label,r.x+r.w/2,r.y+r.h/2+9,26,'#fff','center',700,'#b8691a');
}
function drawHud(){
  const x=14,y=12,w=280;
  ctx.fillStyle='rgba(255,255,255,.4)'; rr(x,y,w,82,22); ctx.fill();
  ctx.strokeStyle=P.uni.glow; ctx.lineWidth=3.5; rr(x,y,w,82,22); ctx.stroke();
  text(P.rider.name+' & '+P.uni.name,x+w/2,y+30,21,'#fff','center',700,INK);
  const sp=P.maxHp<=3?30:(P.maxHp===4?27:23);
  for(let h=0;h<P.maxHp;h++){
    if(h<P.hp) gloss(x+34+h*sp,y+58,9,'#ff5d9a'); else heart(x+34+h*sp,y+58,9,'rgba(255,255,255,.55)');
  }
  const sc=String(Math.floor(P.score));
  text(sc,x+w-18,y+66,26,'#fff','right',700,INK);
  const tw=ctx.measureText(sc).width;
  ctx.shadowColor='#fff'; ctx.shadowBlur=6; star(x+w-18-tw-16,y+57,10,0,'#ffd84a'); ctx.shadowBlur=0;
  const best=Math.max(board[0]?board[0].score:0,Math.floor(P.score));
  ctx.fillStyle='rgba(255,255,255,.4)'; rr(W-190,12,176,40,20); ctx.fill();
  ctx.strokeStyle='#f2b84b'; ctx.lineWidth=3; rr(W-190,12,176,40,20); ctx.stroke();
  text('Record',W-176,38,16,'#fff','left',700,INK); text(String(best),W-28,39,22,'#fff','right',700,INK);
  ctx.fillStyle='rgba(255,255,255,.4)'; rr(W-190,58,112,34,17); ctx.fill(); ctx.strokeStyle='#f2b84b'; ctx.lineWidth=3; rr(W-190,58,112,34,17); ctx.stroke();
  star(W-170,75,10,0,'#ffd84a'); text(String(coins),W-84,83,20,'#fff','right',700,INK);
}
function drawBtn(){
  const b=btnPos(), ready=P.cd<=0&&P.hp>0, ic=ready?'#fff':'rgba(255,255,255,.7)';
  ctx.fillStyle=ready?P.uni.glow:'rgba(80,60,140,.4)'; ctx.beginPath(); ctx.arc(b.x,b.y,34,0,6.3); ctx.fill();
  ctx.strokeStyle='#fff'; ctx.lineWidth=3; ctx.beginPath(); ctx.arc(b.x,b.y,34,0,6.3); ctx.stroke();
  if(!ready&&P.hp>0){ ctx.strokeStyle=P.uni.glow; ctx.lineWidth=6; ctx.beginPath(); ctx.arc(b.x,b.y,34,-Math.PI/2,-Math.PI/2+(1-P.cd/(P.cdMax||P.uni.cd))*6.283); ctx.stroke(); }
  star(b.x,b.y,16,time,ic);
  text('P',b.x+50,b.y+8,24,'#fff','center',700,INK);
}
function drawTitle(){
  panel(780,450);
  text('FEEL Family',W/2,H/2-122,76,'#ffffff','center',700,'#8a3fd8');
  text('à l’école des licornes',W/2,H/2-72,34,'#8a3fd8','center',700,'#ffffff');
  const idx=Math.floor(time/2.5);
  const pv=pvOf(RIDERS[idx%RIDERS.length],UNIS[idx%UNIS.length]);
  ctx.save(); ctx.translate(W/2,H/2+84+Math.sin(time*2)*5); ctx.scale(1.2,1.2); drawUnicorn(pv); ctx.restore();
  if(board[0]) text('Meilleur score : '+board[0].score+'  ('+board[0].rider+' & '+board[0].uni+')',W/2,H/2+158,18,'#5b3a8c','center',600);
  ctx.globalAlpha=.65+.35*Math.sin(time*4);
  text('Appuie sur Espace ou touche l’écran pour jouer',W/2,H/2+194,23,'#8a3fd8','center',700); ctx.globalAlpha=1;
}
function drawSelect(){
  panel(920,500);
  text('Choisis ton équipe',W/2,62,38,'#ffffff','center',700,'#8a3fd8');
  text('Personnage',52,96,18,sel.row===0?'#8a3fd8':'#5b3a8c','left',700);
  text('Licorne',52,298,18,sel.row===1?'#8a3fd8':'#5b3a8c','left',700);
  [0,1].forEach(row=>{
    (row?UNIS:RIDERS).forEach((it,i)=>{
      const c=cardRect(row,i), on=(row?sel.u:sel.r)===i, focus=sel.row===row;
      ctx.fillStyle=on?'rgba(255,255,255,.96)':'rgba(255,255,255,.5)'; rr(c.x,c.y,c.w,c.h,18); ctx.fill();
      ctx.save(); rr(c.x,c.y,c.w,c.h,18); ctx.clip();
      if(row===0){ ctx.translate(c.x+c.w/2,c.y+90); ctx.scale(1.35,1.35); drawRider(it,0); }
      else { ctx.translate(c.x+c.w/2-2,c.y+88); ctx.scale(.64,.64); drawUnicorn(pvOf(null,it),true); }
      ctx.restore();
      ctx.save(); rr(c.x,c.y,c.w,c.h,18); ctx.clip();
      ctx.fillStyle=on?'#8a3fd8':'rgba(74,42,134,.82)'; ctx.fillRect(c.x,c.y+c.h-30,c.w,30);
      ctx.restore();
      ctx.strokeStyle=on?(focus?'#f2b84b':'#b99cff'):'rgba(138,63,216,.25)'; ctx.lineWidth=on?5:2; rr(c.x,c.y,c.w,c.h,18); ctx.stroke();
      text(it.name,c.x+c.w/2,c.y+c.h-9,18,'#ffffff','center',700);
    });
  });
  ctx.fillStyle='rgba(255,255,255,.6)'; rr(712,100,196,330,22); ctx.fill();
  ctx.save(); rr(712,100,196,330,22); ctx.clip();
  ctx.translate(808,230+Math.sin(time*2)*4); drawUnicorn(pvOf(RIDERS[sel.r],UNIS[sel.u])); ctx.restore();
  ctx.strokeStyle='#b99cff'; ctx.lineWidth=3; rr(712,100,196,330,22); ctx.stroke();
  const U=UNIS[sel.u];
  text(RIDERS[sel.r].name+' & '+U.name,810,318,18,INK,'center',700);
  text(U.info[0],810,356,19,'#8a3fd8','center',700);
  text(U.info[1],810,382,16,'#5b3a8c','center',500);
  text(U.info[2],810,404,16,'#5b3a8c','center',500);
  button(PLAYBTN,'Jouer !',sel.row===2);
  drawShopBtn();
  text('← → choisir, ↑ ↓ changer de ligne, Entrée valider, B boutique, M musique',W/2,498,14,'#5b3a8c','center',500);
}
function drawOver(){
  panel(700,470);
  text('Bravo !',W/2,H/2-176,52,'#ffffff','center',700,'#8a3fd8');
  text(`${cur.rider} & ${cur.uni} : ${cur.score} points`,W/2,H/2-134,25,'#5b3a8c','center',700);
  text((rank===0?'Nouveau record !':`Tu es n°${rank+1} au classement`)+'  ·  +'+runCoins+' étoiles',W/2,H/2-106,20,rank===0?'#e0801a':'#5b3a8c','center',700);
  text('Classement',W/2,H/2-70,22,'#8a3fd8','center',700);
  const rows=board.slice(0,5).map((e,i)=>({e,i}));
  if(rank>=5) rows.push({e:cur,i:rank});
  rows.forEach((o,k)=>{
    const y=H/2-52+k*34, me=o.e===cur;
    if(me){ ctx.fillStyle='rgba(138,63,216,.18)'; rr(W/2-300,y,600,30,15); ctx.fill(); }
    const col=me?'#6a2fc0':INK, w=me?700:600;
    text(String(o.i+1)+'.',W/2-276,y+22,20,col,'left',w);
    text(o.e.rider+' & '+o.e.uni,W/2-230,y+22,20,col,'left',w);
    text(String(o.e.score),W/2+276,y+22,20,col,'right',w);
  });
  button(REPLAY,'Rejouer',false); button(MENUBTN,'Menu',false);
}
function draw(){
  if(B&&((state==='bonus'&&B.phase!=='enter'&&B.phase!=='exit')||(state==='pause'&&pauseFrom==='bonus'))){ drawBonus(); if(state==='pause') drawPause(); return; }
  ctx.save();
  if(shake>0) ctx.translate((Math.random()-.5)*8,(Math.random()-.5)*8);
  drawBg();
  if(boss.on){ ctx.fillStyle='rgba(60,20,110,.12)'; ctx.fillRect(0,0,W,H); }
  const inGame=(state==='play'||state==='over'||state==='pause'||state==='bonus');
  if(inGame){ drawTrail(P); drawMagic(P); }
  drawVillain();
  if(inGame){ drawItems(); drawBossFx(); drawUnicorn(P); if(P.shield&&P.hp>0&&state!=='bonus') drawShield(P); drawFireballs(); }
  parts.forEach(q=>{
    ctx.globalAlpha=Math.max(0,q.l);
    if(q.sp) sparkle(q.x,q.y,q.r*1.8,q.c); else { ctx.fillStyle=q.c; ctx.beginPath(); ctx.arc(q.x,q.y,q.r,0,6.3); ctx.fill(); }
  });
  ctx.globalAlpha=1;
  ctx.restore();
  if(state==='play'||state==='pause'||state==='bonus'){ drawHud(); drawBtn(); drawPauseBtn(); if(bannerT>0) drawBanner(); if(state==='play'&&portalMsgT>0) drawPortalMsg(); if(boss.on&&state!=='bonus') drawBossBar(); if(toastT>0) drawToast(); }
  if(state==='bonus'&&B) drawWarpOverlay();
  if(state==='pause') drawPause();
  if(state==='title'){ drawTitle(); drawGear(); }
  if(state==='code') drawCode();
  if(state==='dev') drawDev();
  if(state==='select') drawSelect();
  if(state==='shop') drawShop();
  if(state==='over') drawOver();
  drawMusicBtn();
}

let last=performance.now();
function loop(now){
  const dt=Math.min(.05,(now-last)/1000); last=now;
  update(dt); draw(); requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
